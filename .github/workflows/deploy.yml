name: Deploy Frontend MedSinc

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: https://api.medsinc.com.br/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build to CloudPanel
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "/home/github-deploy/tmp/medsinc-frontend"
          strip_components: 1

      - name: Publish frontend
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            TARGET="$HOME/htdocs/medsinc.com.br"
            BUILD="$HOME/tmp/medsinc-frontend"

            echo "=== Limpando build anterior ==="

            find "$TARGET" -mindepth 1 -maxdepth 1 \
              ! -name "uploads" \
              -exec rm -rf {} +

            echo "=== Publicando novo build ==="

            cp -r "$BUILD"/. "$TARGET"/

            echo "=== Limpando arquivos temporários ==="

            rm -rf "$BUILD"

            echo "=== Verificando publicação ==="

            if [ ! -f "$TARGET/index.html" ]; then
              echo "ERRO: index.html não encontrado."
              exit 1
            fi

            echo "Frontend publicado com sucesso!"

            ls -lah "$TARGET"